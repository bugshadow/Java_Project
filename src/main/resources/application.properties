# ================================================================
# Configuration Application Inventaire Blockchain
# ================================================================

# --- Base de données PostgreSQL ---
# Renseigner les identifiants sensibles dans le fichier .env (voir .env.example)
# db.url=jdbc:postgresql://localhost:5432/inventaire_db
# db.username=postgres
# db.password=postgres

# Pool de connexions HikariCP
db.pool.maxSize=20
db.pool.minIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# --- Hyperledger Fabric ---
fabric.channel=inventaire-channel
fabric.chaincode=inventaire-cc
fabric.mspId=InventaireMSP
fabric.identity=admin

# Chemins relatifs depuis la racine du projet
fabric.cryptoPath=docker/crypto-config/peerOrganizations/inventaire.com
fabric.connectionProfile=docker/connection-profile.yaml

# Paramètres réseau
fabric.discovery=false

# --- Chemins et Rapports ---
# Répertoire d'export par défaut pour les rapports (PDF/Excel)
app.export.dir=exports/
